name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.23.1
  NPM_VERSION: 11.17.0

jobs:
  root-foundation:
    name: Root foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global --ignore-scripts --no-audit --no-fund "npm@${NPM_VERSION}"

      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run root security tests
        run: npm test

  epdg-backend-core:
    name: EPDG build, lint, and route security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: epdg-backend-core
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: epdg-backend-core/package-lock.json

      - name: Pin npm
        run: npm install --global --ignore-scripts --no-audit --no-fund "npm@${NPM_VERSION}"

      - name: Verify toolchain
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build production artifact
        run: npm run build

      - name: Lint TypeScript source
        run: npm run lint

      - name: Run route and security tests
        run: npm test
