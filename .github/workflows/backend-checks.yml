name: Backend checks

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/supabase-synthetic-provider-20261028

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Pin and verify toolchain
        run: |
          npm install --global npm@11.17.0
          test "$(node --version)" = "v22.23.1"
          test "$(npm --version)" = "11.17.0"
      - name: Deterministic install
        run: npm ci
      - name: Foundation security tests
        run: npm test

  core:
    name: Core build, security tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: epdg-backend-core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Pin and verify toolchain
        run: |
          npm install --global npm@11.17.0
          test "$(node --version)" = "v22.23.1"
          test "$(npm --version)" = "11.17.0"
      - name: Deterministic install
        run: npm ci
      - name: Build and security tests
        run: npm test
      - name: Lint
        run: npm run lint

  native-intake:
    name: Native synthetic intake checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions/website-intake-synthetic
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2, verified 2026-10-28
        with:
          deno-version: '2.8.1'
          cache: false
      - name: Verify pinned native toolchain
        run: test "$(deno --version | head -n 1 | cut -d ' ' -f 2)" = '2.8.1'
      - name: Native tests without runtime permissions
        run: deno test --frozen --no-prompt --deny-net --deny-env --deny-read --deny-write --deny-run handler_test.ts
      - name: Frozen type checks
        run: deno check --frozen handler.ts handler_test.ts index.ts protocol.ts
      - name: Native lint
        run: deno lint
      - name: Native formatting
        run: deno fmt --check
